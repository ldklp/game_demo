<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForestTable · 克苏鲁森林逃生</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= 标题 / 组队 ================= -->
<section id="screenTitle" class="screen">
  <div class="titlewrap">
    <div class="tkicker">多人合作 · 回合制生存</div>
    <h1>Forest<span>Table</span></h1>
    <p class="tsub">每天五张事件牌、五次投票、五碗汤。<br>你们要商量的不是怎么打赢，是怎么活着走出去。</p>

    <div class="setup">
      <div class="suhead">
        <span>队伍</span>
        <button id="addSlot" class="ghost small">+ 加一人</button>
      </div>
      <div id="roster"></div>
      <div class="sufoot">
        <button id="startBtn" class="primary big">进入森林</button>
        <button id="continueBtn" class="ghost big hidden">继续上次存档</button>
      </div>
    </div>

    <div class="tnote">
      原型 v1.0 · 4 个阶段可通关 · 支持 2–4 人同屏热座<br>
      美术资源放在 <code>assets/</code> 下即可自动替换占位图
    </div>
  </div>
</section>

<!-- ================= 游戏主界面 ================= -->
<section id="screenGame" class="screen hidden">
  <header id="topbar"></header>
  <div class="board">
    <aside class="players" id="playersCol"></aside>
    <main class="center" id="centerCol"></main>
    <aside class="side">
      <div class="panel" id="invPanel"></div>
      <div class="panel" id="logPanel"></div>
    </aside>
  </div>
</section>

<div id="modalLayer"></div>
<div id="toastLayer"></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () { FT.UI.init(); });
</script>
</body>
</html>
